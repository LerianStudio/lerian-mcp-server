name: Release Pipeline

# The ONLY vehicle that publishes this package. Nothing here reaches npm
# without the `quality` job green first (see `needs:` on `publish`).

on:
  push:
    branches:
      - main        # The only release branch and the only trigger. No
                    # workflow_dispatch: release secrets must never be handed
                    # to code from an arbitrary ref.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (Node ${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range in package.json `engines`, same as
        # ci.yml — the publish job waits on every leg, so nothing ships that
        # fails on the declared Node floor.
        node-version: ['20.19', '22']
    # Runs untrusted code (dependency install scripts, repo tests): read-only
    # token, and no credentials left behind in .git/config for it to reuse.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `ci:all` ends in a non-blocking `npm audit` that only prints. The
      # blocking dependency audit is the Security Check job in ci.yml, on pull
      # requests — the release path has no vulnerability floor of its own.
      - name: Lint, typecheck, build, test
        run: npm run ci:all

      # wave 2 slot: boot test of the packed artifact (npm pack -> install -> start
      # -> assert the tool surface) goes here, as a step of this gate.

  publish:
    name: Create Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: quality
    # The only job that needs write scopes: semantic-release pushes the version
    # commit and tag, opens the GitHub Release and comments on issues/PRs;
    # `packages` is the GitHub Packages channel below.
    permissions:
      contents: write
      issues: write
      packages: write
      pull-requests: write
    outputs:
      skip_release: ${{ steps.semantic.outputs.new_release_published == 'false' }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private_key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for release
        run: npm run build:release

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.LERIAN_CI_CD_USER_NAME }}"
          git config user.email "${{ secrets.LERIAN_CI_CD_USER_EMAIL }}"

      - name: Configure npm authentication
        run: |
          echo "@lerianstudio:registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/git@10.0.1
            @semantic-release/github@11.0.6
            @semantic-release/npm@13.1.5
            @semantic-release/release-notes-generator@14.1.0
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

      # channel continuation pending product decision (see plan deviations)
      - name: Publish to GitHub Packages
        if: steps.semantic.outputs.new_release_published == 'true'
        # npm is published, tagged and released by this point: a failure on the
        # secondary channel stays a red step, never a red release.
        continue-on-error: true
        run: |
          set -euo pipefail
          # Restore the real package.json whatever happens next: no later step
          # may inherit the GitHub Packages registry.
          cp package.json package.json.orig
          trap 'mv package.json.orig package.json' EXIT
          # `publishConfig.registry` outranks both --registry and .npmrc, so
          # rewriting it is the only way to redirect this publish.
          node -e "
            const pkg = require('./package.json');
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
