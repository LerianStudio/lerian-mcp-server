name: Release Pipeline

# The ONLY vehicle that publishes this package. Nothing here reaches npm
# without the `quality` job green first (see `needs:` on `publish`).

on:
  push:
    branches:
      - main        # The only release branch and the only trigger. No
                    # workflow_dispatch: release secrets must never be handed
                    # to code from an arbitrary ref.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Runs untrusted code (dependency install scripts, repo tests): read-only
    # token, and no credentials left behind in .git/config for it to reuse.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `ci:all` ends in a non-blocking `npm audit` that only prints. The
      # blocking dependency audit is the Security Check job in ci.yml, on pull
      # requests — the release path has no vulnerability floor of its own.
      - name: Lint, typecheck, build, test
        run: npm run ci:all

      # wave 2 slot: boot test of the packed artifact (npm pack -> install -> start
      # -> assert the tool surface) goes here, as a step of this gate.

  publish:
    name: Create Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: quality
    # The only job that needs write scopes: semantic-release pushes the version
    # commit and tag, opens the GitHub Release and comments on issues/PRs.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      skip_release: ${{ steps.semantic.outputs.new_release_published == 'false' }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private_key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build for release
        run: npm run build:release

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.LERIAN_CI_CD_USER_NAME }}"
          git config user.email "${{ secrets.LERIAN_CI_CD_USER_EMAIL }}"

      - name: Configure npm authentication
        run: |
          echo "@lerianstudio:registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/git@10.0.1
            @semantic-release/github@11.0.6
            @semantic-release/npm@13.1.5
            @semantic-release/release-notes-generator@14.1.0
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

      # Legacy name mirror, absorbed from the deleted dual-publish workflow.
      # Same commit, same version, same artifact — only the package name differs.
      # Removal is a wave-2 decision, together with `npm deprecate`.
      #
      # The two names have diverged: the legacy one already carries versions
      # this one never published (4.0.0 among them). Mirroring is therefore
      # best-effort and idempotent — a version already on the legacy name is
      # skipped, never republished, and never turns a shipped release red.
      - name: Mirror release to legacy package name
        if: steps.semantic.outputs.new_release_published == 'true'
        # The real release is already published and tagged by this point. A
        # failure here is a mirror failure, not a release failure, and must not
        # paint the run red — it stays visible as a failed step.
        continue-on-error: true
        run: |
          set -euo pipefail
          if npm view "@lerianstudio/midaz-mcp-server@${VERSION}" version >/dev/null 2>&1; then
            echo "Legacy name already published at ${VERSION} — nothing to mirror."
            exit 0
          fi
          # Restore the real package.json whatever happens next: later steps in
          # this job must never see the legacy name.
          cp package.json package.json.orig
          trap 'mv package.json.orig package.json' EXIT
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@lerianstudio/midaz-mcp-server';
            pkg.description = 'DEPRECATED: Use @lerianstudio/lerian-mcp-server instead. ' + pkg.description;
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.semantic.outputs.new_release_version }}
