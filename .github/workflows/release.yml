name: Release Pipeline

# The ONLY vehicle that publishes this package. Nothing here reaches npm
# without the `quality` job green first (see `needs:` on `publish`).

on:
  push:
    branches:
      - main        # The only release branch and the only trigger. No
                    # workflow_dispatch: release secrets must never be handed
                    # to code from an arbitrary ref.

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (Node ${{ matrix.node-version }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range in package.json `engines`, same as
        # ci.yml — the publish job waits on every leg, so nothing ships that
        # fails on the declared Node floor.
        node-version: ['20.19', '22']
    # Runs untrusted code (dependency install scripts, repo tests): read-only
    # token, and no credentials left behind in .git/config for it to reuse.
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # No package in the lockfile declares an install script, so skipping them
      # installs the same tree while keeping arbitrary dependency code from
      # running here. The build below is explicit and unaffected.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # `ci:all` ends in a non-blocking `npm audit` that only prints. The
      # blocking dependency audit is the Security Check job in ci.yml, on pull
      # requests — the release path has no vulnerability floor of its own.
      - name: Lint, typecheck, build, test
        run: npm run ci:all

      # wave 2 slot: boot test of the packed artifact (npm pack -> install -> start
      # -> assert the tool surface) goes here, as a step of this gate.

  publish:
    name: Create Release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: quality
    # Write scopes for semantic-release only: it pushes the version commit and
    # tag, opens the GitHub Release and comments on issues/PRs. The GitHub
    # Packages channel lives in its own job below, with its own scopes.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      skip_release: ${{ steps.semantic.outputs.new_release_published == 'false' }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: tibdex/github-app-token@v2
        with:
          app_id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
          private_key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Same reasoning as the gate, and it matters more here: this job holds the
      # npm token, the GPG key and the GitHub App token. No lockfile package
      # declares an install script, so nothing is lost by refusing to run them.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for release
        run: npm run build:release

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Configure Git
        run: |
          git config user.name "${{ secrets.LERIAN_CI_CD_USER_NAME }}"
          git config user.email "${{ secrets.LERIAN_CI_CD_USER_EMAIL }}"

      - name: Configure npm authentication
        run: |
          echo "@lerianstudio:registry=https://registry.npmjs.org/" > ~/.npmrc
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
          echo "registry=https://registry.npmjs.org/" >> ~/.npmrc
          npm whoami
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 25.0.3
          extra_plugins: |
            @semantic-release/changelog@6.0.3
            @semantic-release/commit-analyzer@13.0.1
            @semantic-release/git@10.0.1
            @semantic-release/github@11.0.6
            @semantic-release/npm@13.1.5
            @semantic-release/release-notes-generator@14.1.0
            conventional-changelog-conventionalcommits@9.3.1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GIT_AUTHOR_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          GIT_COMMITTER_NAME: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

  # channel continuation pending product decision (see plan deviations)
  #
  # Secondary channel in its own job so npm and GitHub Packages fail
  # independently: the npm release is shipped and green by the time this runs,
  # and a failure here is a red job that "re-run failed jobs" can retry on its
  # own: `needs.publish.outputs` survive failed-job reruns, and the version
  # guard below makes the retry idempotent.
  github-packages:
    name: Publish to GitHub Packages
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish
    if: needs.publish.outputs.skip_release == 'false'
    permissions:
      contents: read
      packages: write
    steps:
      # The release tag is the commit semantic-release just pushed, so
      # package.json already carries the released version.
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.publish.outputs.new_release_version }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Same reasoning as the other jobs: no lockfile package declares an
      # install script, and the build below is explicit.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for release
        run: npm run build:release

      # The artifact is already built above; --ignore-scripts keeps the
      # redundant `prepare` hook away from the publish credentials.
      - name: Publish to GitHub Packages
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
          if npm view "@lerianstudio/lerian-mcp-server@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "GitHub Packages already has ${VERSION}; nothing to publish."
            exit 0
          fi
          # `publishConfig.registry` outranks both --registry and .npmrc, so
          # rewriting it is the only way to redirect this publish.
          node -e "
            const pkg = require('./package.json');
            pkg.publishConfig = { registry: 'https://npm.pkg.github.com', access: 'public' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish.outputs.new_release_version }}
