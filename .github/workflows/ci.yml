name: CI

# The only workflow that lints, typechecks, builds and tests this repo, and the
# command it runs is the one the release gate runs. Absorbed `feature-ci.yml`
# (deleted) together with its extra branch triggers and its blocking `npm audit`;
# `code-quality.yml` keeps CodeQL and dependency review, `security.yml` the deep
# custom audit, and neither duplicates the checks below any more.

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'docs/**'
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Both ends of the supported range in package.json `engines`.
        node-version: ['20.19', '22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Same command the release quality gate runs, so "CI green" and
      # "releasable" cannot drift apart. The `npm audit` at the tail of
      # `ci:all` only prints — the blocking one is the Security Check job.
      - name: Lint, typecheck, build, test
        run: npm run ci:all

  security:
    name: Security Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate
